chat_model:
  init_args:
    model: qwen-vl-max
    model_provider: openai
    api_key:
    base_url: https://yunwu.ai/v1
  max_requests_per_minute: 500
  max_requests_per_day: 2000
image_generator:
  class_path: tools.ImageGeneratorDoubaoSeedreamYunwuAPI
  init_args:
    api_key:
    model: doubao-seedream-4-0-250828
  max_requests_per_minute: null
  max_requests_per_day: null
video_generator:
  class_path: tools.VideoGeneratorDoubaoSeedanceYunwuAPI
  init_args:
    api_key:
    t2v_model: doubao-seedance-1-5-pro-251215
    ff2v_model: doubao-seedance-1-5-pro-251215
    flf2v_model: doubao-seedance-1-5-pro-251215
  max_requests_per_minute: null
  max_requests_per_day: null
working_dir: .working_dir/script2video
character_assets:
  enabled: false
  registry_path: assets/characters/registry.yaml
  default_match_policy: ask_user
language:
  target_language: zh-CN   # 配音/字幕目标语言：zh-CN 简体中文 | en 英文 | 留空=跟随剧本
  chinese_mode: true        # 旧版开关；target_language 优先
  spoken_content_language: zh-CN
  visual_description_language: zh-CN
  image_text_policy: none   # 画面内不出任何文字：图像模型渲染文字易乱码/镜像，需要的文字用后期叠加。改回 essential 可允许剧情必需文字
subtitle:
  enabled: true
  burn_in: true
  font_path: null
  fallback_fonts:
  - Microsoft YaHei
  - SimHei
  - Noto Sans CJK SC
  style:
    position: bottom
    font_size: 42
    primary_color: white
    outline_color: black
    outline_width: 2
    margin_v: 30
compliance:
  aigc_label:
    enabled: true
    text: AI生成
    position: bottom_right
    font_size: 30
moderation:
  enabled: false
  provider: keyword
  keywords: []
quality:
  consistency:
    enabled: true          # 开启视觉质检（每镜首帧过一次 VLM；不达标会定向重生成）
    threshold: 0.6         # 人物一致性（有角色参考图时）
    max_retries: 2         # 每镜最多自动重生成次数
    aesthetic_threshold: 0.6   # 画质：抓扭曲/乱码/镜像文字、畸形肢体、模糊
    adherence_threshold: 0.65  # 画面贴合度：同一次质检检查角色/道具的位置、状态与动作
    temporal_threshold: 0.6    # 镜内连贯：抓首尾帧穿模/形变/物体突变
    scene_threshold: 0.65      # 跨镜连续：同机位保轴线/空间投影并允许分镜运镜，换机位保场景世界与拓扑
    video_sampling_enabled: true  # 一次多图质检覆盖视频中段，不增加每角色请求次数
    video_sample_fractions: [0.0, 0.25, 0.5, 0.75, 1.0]
creative:
  domain: general
video:
  aspect_ratio: landscape
  transition:
    type: none
    duration: 0.5
  hook:
    enabled: false
    auto: true
    candidates: 3
    text: null
    seconds: 3.0
    font_size: 72
    color: '#FFD24A'
    position: top
    margin_v: 60
  cover:
    enabled: false
    at: 0.0
    filename: poster.jpg
audio:
  fit_shot_to_speech: true
  fit_tail_pad: 0.4
  max_shot_extend: 6.0
  tts:
    enabled: false
    provider: openai
    model: tts-1
    voice: alloy
    response_format: mp3
    speed: 1.0
    mix_with_original: false
  bgm:
    enabled: false
    path: null
    dir: null
    volume: 0.2
    ducking:
      enabled: true
      strength: balanced
      attack_ms: 20
      release_ms: 350
  sfx:
    enabled: false
    library: null
    volume: 0.8
  loudnorm:
    enabled: true
    i: -16.0
    tp: -1.5
    lra: 11.0
hosting:
  enabled: false
  type: local_static
  public_base_url: ''
  local_root: .public_artifacts
messaging:
  inbound_enabled: false
  outbound_enabled: false
  channels:
  - type: feishu
    enabled: false
    app_id: ${FEISHU_APP_ID}
    app_secret: ${FEISHU_APP_SECRET}
    receive_id_type: open_id
    default_target: ${FEISHU_DEFAULT_TARGET}
  - type: wechat
    enabled: false
    adapter: personal_wechat
security:
  authorized_sources: []
rate_limits:
  per_user:
    max_requests_per_day: null
    max_concurrent_sessions: 1
  global:
    max_concurrent_generations: 2
generation_budget:
  max_scenes: 3
  max_total_shots: 12
  max_shot_regenerations: 2
  default_shot_duration_seconds: 5
